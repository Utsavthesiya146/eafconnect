name: Build Android APK & App Bundle

on:
  push:
    branches:
      - main
    paths:
      - 'eaf_mobile/**'
      - '.github/workflows/android_release.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        working-directory: eaf_mobile
        run: flutter pub get

      - name: 📱 Build Android APK (Release)
        working-directory: eaf_mobile
        run: flutter build apk --release

      - name: 📦 Build Android App Bundle (Release AAB)
        working-directory: eaf_mobile
        run: flutter build appbundle --release

      - name: 💾 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EAF_Connect_Android_APK
          path: eaf_mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: 💾 Upload AAB Artifact (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: EAF_Connect_Android_AAB
          path: eaf_mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 14

