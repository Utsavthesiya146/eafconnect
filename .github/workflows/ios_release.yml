name: Build & Release iOS App to App Store

on:
  push:
    branches:
      - main
    paths:
      - 'eaf_mobile/**'
      - '.github/workflows/ios_release.yml'
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: 'Upload build to App Store Connect / TestFlight'
        required: true
        type: boolean
        default: true
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-and-release-ios:
    name: Build & Deploy iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java (for tools if needed)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 🍎 Select Latest Xcode & SDK (Required by Apple App Store)
        run: |
          echo "Available Xcode installations on runner:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          XCODE_TARGET=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Activating Latest Xcode: $XCODE_TARGET"
          sudo xcode-select -s "$XCODE_TARGET/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_TARGET/Contents/Developer" >> $GITHUB_ENV
          xcodebuild -version

      - name: 🔍 Verify Flutter & Xcode Environment
        run: |
          flutter --version
          xcodebuild -version


      - name: 📦 Install Flutter Dependencies
        working-directory: eaf_mobile
        run: |
          flutter pub get

      - name: 🔐 Install Apple Certificate & Provisioning Profile
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-random-pass-123' }}
        run: |
          # 1. Create temporary keychain
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$APPLE_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode > "$CERTIFICATE_PATH"
          echo "$APPLE_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 2. Import certificate into keychain (with automatic legacy fallback)
          if ! security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" 2>/dev/null; then
            echo "⚠️ Direct PKCS#12 import failed (likely modern OpenSSL 3 encryption). Re-encrypting with legacy algorithms for macOS Keychain compatibility..."
            openssl pkcs12 -in "$CERTIFICATE_PATH" -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -nodes -legacy 2>/dev/null | \
            openssl pkcs12 -export -out "$CERTIFICATE_PATH" -passout "pass:$APPLE_CERTIFICATE_PASSWORD" -legacy 2>/dev/null || true
            security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          fi
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true

          # 3. Put provisioning profile into Apple's directory
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist" 2>/dev/null || true
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist" 2>/dev/null || strings "$PP_PATH" | grep -A1 -m1 UUID | tail -n1 | sed -e 's/<[^>]*>//g' | tr -d '[:space:]')
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist" 2>/dev/null || echo "EAF Connect AppStore")

          if [ -n "$PROFILE_UUID" ]; then
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
            echo "Installed profile UUID: $PROFILE_UUID"
            echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          else
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          fi
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

          echo "✅ Apple Certificate and Provisioning Profile ($PROFILE_NAME) installed successfully!"

      - name: 🛠️ Dynamically Configure ExportOptions.plist & Signing
        if: env.APPLE_TEAM_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: eaf_mobile
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.eafconnect.eafConnect</key>
                  <string>${PROFILE_NAME:-EAF Connect AppStore}</string>
              </dict>
          </dict>
          </plist>
          EOF
          echo "✅ ExportOptions.plist configured for manual App Store signing."

          # Inject Team and Signing configs into Release.xcconfig
          echo "DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME:-EAF Connect AppStore}" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_STYLE = Manual" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = Apple Distribution" >> ios/Flutter/Release.xcconfig
          echo "✅ Release.xcconfig updated with Team ID: $APPLE_TEAM_ID and Profile: ${PROFILE_NAME:-EAF Connect AppStore}"

      - name: 🎨 Ensure Official EAF App Icons
        working-directory: eaf_mobile
        run: |
          dart run flutter_launcher_icons || true

      - name: 📱 Build iOS IPA (Signed)
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        working-directory: eaf_mobile
        run: |
          BUILD_NUM=${{ github.run_number }}
          echo "Building iOS Release IPA Version: $VERSION_NAME+$BUILD_NUM"
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUM"

      - name: 🧪 Build Unsigned Release (Fallback when no secrets)
        if: env.APPLE_CERTIFICATE_BASE64 == ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        working-directory: eaf_mobile
        run: |
          echo "⚠️ Apple Signing Secrets not detected. Performing verification build without code signing..."
          flutter build ios --release --no-codesign
          echo "✅ Verification build succeeded!"

      - name: 💾 Upload IPA Artifact
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: EAF_Connect_iOS_Release
          path: eaf_mobile/build/ios/ipa/*.ipa
          retention-days: 14

      - name: 🚀 Upload IPA to App Store Connect / TestFlight
        if: env.APPLE_CERTIFICATE_BASE64 != '' && env.APP_STORE_CONNECT_KEY_ID != '' && (github.event.inputs.upload_to_app_store != 'false')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          KEY_ID=$(echo -n "${APP_STORE_CONNECT_KEY_ID}" | tr -d '[:space:]')
          ISSUER_ID=$(echo -n "${APP_STORE_CONNECT_ISSUER_ID}" | tr -d '[:space:]')

          echo "Configuring App Store Connect API Key for Key ID: $KEY_ID..."

          python3 -c "
          import os
          key_content = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '').strip()
          if 'BEGIN PRIVATE KEY' not in key_content:
              import base64
              key_content = base64.b64decode(key_content).decode('utf-8')
          # Normalize line endings to strict UNIX LF
          key_content = '\n'.join([line.strip() for line in key_content.splitlines() if line.strip()]) + '\n'

          key_id = '$KEY_ID'
          paths = [
              os.path.expanduser(f'~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8'),
              os.path.expanduser(f'~/.private_keys/AuthKey_{key_id}.p8'),
              os.path.expanduser(f'~/private_keys/AuthKey_{key_id}.p8'),
          ]
          for p in paths:
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, 'w', newline='\n') as f:
                  f.write(key_content)
              os.chmod(p, 0o600)
              print(f'Configured key file: {p} ({len(key_content)} bytes)')
          "

          echo "Verifying EC private key with OpenSSL..."
          openssl ec -in ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 -check -noout

          IPA_PATH=$(find eaf_mobile/build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -f "$IPA_PATH" ]; then
            echo "Uploading $IPA_PATH to App Store Connect (Issuer: $ISSUER_ID, Key: $KEY_ID)..."
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID" \
              --show-progress
            echo "🎉 Successfully uploaded IPA to App Store Connect / TestFlight!"
          else
            echo "❌ No .ipa file found in eaf_mobile/build/ios/ipa"
            exit 1
          fi

      - name: 💾 Upload Build Artifact (Unsigned Fallback)
        if: env.APPLE_CERTIFICATE_BASE64 == ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: EAF_Connect_iOS_Unsigned_App
          path: eaf_mobile/build/ios/iphoneos/Runner.app
          retention-days: 7
