name: eaf_connect
description: "EAF Connect - Business Networking App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # HTTP / API
  dio: ^5.7.0

  # Secure storage (for token)
  flutter_secure_storage: ^9.2.2

  # Image picker
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/eaf_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/eaf_logo.png"
  adaptive_icon_margin: 20
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
