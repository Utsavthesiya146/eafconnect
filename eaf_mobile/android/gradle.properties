# JVM memory — safe settings for 8 GB RAM machine
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Force Gradle to use Temurin JDK 17
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.16.8-hotspot

# Stable build settings — disable daemon and incremental caches to prevent daemon crash
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# Android
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
