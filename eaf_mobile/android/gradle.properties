# JVM memory — safe settings for 8 GB RAM machine (i5-6300U, 4 cores)
# Root cause of previous crash: -Xmx8G exhausted all available RAM on a machine
# with only 8072 MB physical memory, causing a G1 GC mmap failure (OOM).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8

# Force Gradle to use Temurin JDK 17 (shell Java) instead of Android Studio JBR (Java 21).
# AGP 9.1.0 requires Java 17+; Kotlin 2.4.0 compiles to JVM 17 target in this project.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.16.8-hotspot

# Gradle performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
